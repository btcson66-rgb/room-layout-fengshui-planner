<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="title desc">
  <title id="title">床對門四種情況圖解</title>
  <desc id="desc">四張平面示意：床尾正對門（最需處理）、床側落在門口視線內（處理光線與隱私）、床頭靠門邊（枕邊離門片太近）、門與床不成直線（通常不需化解）。</desc>
  <rect width="980" height="400" rx="20" fill="#f7f4eb"/>
  <rect x="30" y="70" width="200" height="230" fill="#fff" stroke="#33443b" stroke-width="5"/>
  <path d="M100 70H160" stroke="#fff" stroke-width="9"/>
  <path d="M100 70V130A60 60 0 0 0 160 70" fill="none" stroke="#806d50" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="85" y="180" width="90" height="110" rx="6" fill="#dce7df" stroke="#33443b" stroke-width="3"/>
  <rect x="93" y="266" width="74" height="18" rx="6" fill="#fff" stroke="#33443b" stroke-width="2"/>
  <path d="M130 70L130 180" stroke="#b54a46" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="144.0" y="40" font-family="sans-serif" font-size="18" fill="#33443b" text-anchor="middle" font-weight="700">床尾正對門</text>
  <text x="130.0" y="334" font-family="sans-serif" font-size="16" fill="#b54a46" text-anchor="middle" font-weight="700">開門直見整張床：最需處理</text>
  <circle cx="40" cy="34" r="16" fill="#b54a46"/><path d="M32 26l16 16M48 26l-16 16" stroke="#fff" stroke-width="4"/>
  <rect x="265" y="70" width="200" height="230" fill="#fff" stroke="#33443b" stroke-width="5"/>
  <path d="M285 70H345" stroke="#fff" stroke-width="9"/>
  <path d="M285 70V130A60 60 0 0 0 345 70" fill="none" stroke="#806d50" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="370" y="130" width="90" height="110" rx="6" fill="#dce7df" stroke="#33443b" stroke-width="3"/>
  <rect x="378" y="136" width="74" height="18" rx="6" fill="#fff" stroke="#33443b" stroke-width="2"/>
  <path d="M315 75L370 190" stroke="#c28a1e" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="379.0" y="40" font-family="sans-serif" font-size="18" fill="#33443b" text-anchor="middle" font-weight="700">床側在門口視線內</text>
  <text x="365.0" y="334" font-family="sans-serif" font-size="16" fill="#c28a1e" text-anchor="middle" font-weight="700">先處理光線與隱私</text>
  <circle cx="275" cy="34" r="16" fill="#c28a1e"/><text x="275" y="40" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">!</text>
  <rect x="500" y="70" width="200" height="230" fill="#fff" stroke="#33443b" stroke-width="5"/>
  <path d="M510 70H570" stroke="#fff" stroke-width="9"/>
  <path d="M510 70V130A60 60 0 0 0 570 70" fill="none" stroke="#806d50" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="575" y="75" width="90" height="110" rx="6" fill="#dce7df" stroke="#33443b" stroke-width="3"/>
  <rect x="583" y="81" width="74" height="18" rx="6" fill="#fff" stroke="#33443b" stroke-width="2"/>
  <path d="M540 70L580 100" stroke="#b54a46" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="614.0" y="40" font-family="sans-serif" font-size="18" fill="#33443b" text-anchor="middle" font-weight="700">床頭靠門邊</text>
  <text x="600.0" y="334" font-family="sans-serif" font-size="16" fill="#b54a46" text-anchor="middle" font-weight="700">枕邊離門片太近</text>
  <circle cx="510" cy="34" r="16" fill="#b54a46"/><path d="M502 26l16 16M518 26l-16 16" stroke="#fff" stroke-width="4"/>
  <rect x="735" y="70" width="200" height="230" fill="#fff" stroke="#33443b" stroke-width="5"/>
  <path d="M865 70H925" stroke="#fff" stroke-width="9"/>
  <path d="M925 70V130A60 60 0 0 1 865 70" fill="none" stroke="#806d50" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="743" y="180" width="90" height="110" rx="6" fill="#dce7df" stroke="#33443b" stroke-width="3"/>
  <rect x="749" y="188" width="18" height="94" rx="6" fill="#fff" stroke="#33443b" stroke-width="2"/>
  <path d="M895 70L895 290" stroke="#2f7d57" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="849.0" y="40" font-family="sans-serif" font-size="18" fill="#33443b" text-anchor="middle" font-weight="700">門與床不成直線</text>
  <text x="835.0" y="334" font-family="sans-serif" font-size="16" fill="#2f7d57" text-anchor="middle" font-weight="700">通常不需要化解</text>
  <circle cx="745" cy="34" r="16" fill="#2f7d57"/><path d="M736 34l6 7 12-14" stroke="#fff" stroke-width="4" fill="none"/>
  <text x="490" y="380" font-family="sans-serif" font-size="16" fill="#4a5c52" text-anchor="middle">虛線＝從門口看進房間的直線視線；先判斷屬於哪一種，再選化解方式。</text>

</svg>
