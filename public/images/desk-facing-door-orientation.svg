<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">書桌背對門、正對門、斜對門圖解</title>
  <desc id="desc">三張平面示意：書桌背對門看不到門口；書桌正對門坐著直視門口；背靠實牆、斜對門口既有靠又看得到門，是最推薦的座向。</desc>
  <rect width="960" height="400" rx="20" fill="#f7f4eb"/>
  <rect x="30" y="80" width="270" height="220" fill="#fff" stroke="#33443b" stroke-width="5"/>
  <path d="M60 80H120" stroke="#fff" stroke-width="9"/>
  <path d="M60 80V140A60 60 0 0 0 120 80" fill="none" stroke="#806d50" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="150" y="245" width="110" height="50" fill="#e9d9c9" stroke="#33443b" stroke-width="3"/>
  <circle cx="205" cy="220" r="16" fill="#fff" stroke="#33443b" stroke-width="3"/>
  <path d="M90 110L200 210" stroke="#b54a46" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="165.0" y="46" font-family="sans-serif" font-size="19" fill="#33443b" text-anchor="middle" font-weight="700">背對門</text>
  <circle cx="284" cy="40" r="16" fill="#b54a46"/><path d="M276 32l16 16M292 32l-16 16" stroke="#fff" stroke-width="4"/>
  <text x="165.0" y="334" font-family="sans-serif" font-size="15" fill="#b54a46" text-anchor="middle" font-weight="700">看不到誰進來：加高背椅或小鏡子</text>
  <rect x="340" y="80" width="270" height="220" fill="#fff" stroke="#33443b" stroke-width="5"/>
  <path d="M370 80H430" stroke="#fff" stroke-width="9"/>
  <path d="M370 80V140A60 60 0 0 0 430 80" fill="none" stroke="#806d50" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="345" y="190" width="110" height="45" fill="#e9d9c9" stroke="#33443b" stroke-width="3"/>
  <circle cx="400" cy="260" r="16" fill="#fff" stroke="#33443b" stroke-width="3"/>
  <path d="M400 85L400 188" stroke="#b54a46" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="475.0" y="46" font-family="sans-serif" font-size="19" fill="#33443b" text-anchor="middle" font-weight="700">正對門（開門見書桌）</text>
  <circle cx="594" cy="40" r="16" fill="#b54a46"/><path d="M586 32l16 16M602 32l-16 16" stroke="#fff" stroke-width="4"/>
  <text x="475.0" y="334" font-family="sans-serif" font-size="15" fill="#b54a46" text-anchor="middle" font-weight="700">坐著直視門口：側移並轉角度</text>
  <rect x="650" y="80" width="270" height="220" fill="#fff" stroke="#33443b" stroke-width="5"/>
  <path d="M680 80H740" stroke="#fff" stroke-width="9"/>
  <path d="M680 80V140A60 60 0 0 0 740 80" fill="none" stroke="#806d50" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="790" y="195" width="110" height="45" fill="#e9d9c9" stroke="#33443b" stroke-width="3"/>
  <circle cx="845" cy="270" r="16" fill="#fff" stroke="#33443b" stroke-width="3"/>
  <path d="M710 110L830 256" stroke="#2f7d57" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="785.0" y="46" font-family="sans-serif" font-size="19" fill="#33443b" text-anchor="middle" font-weight="700">背靠牆、斜對門</text>
  <circle cx="904" cy="40" r="16" fill="#2f7d57"/><path d="M895 40l6 7 12-14" stroke="#fff" stroke-width="4" fill="none"/>
  <text x="785.0" y="334" font-family="sans-serif" font-size="15" fill="#2f7d57" text-anchor="middle" font-weight="700">背後有靠又看得到門：最推薦</text>
  <text x="480" y="380" font-family="sans-serif" font-size="16" fill="#4a5c52" text-anchor="middle">圓形＝坐著的人（面向桌子）。門洞向內 60～75 公分內不要放桌椅。</text>

</svg>
