<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">客廳掛鐘高度立面圖</title>
  <desc id="desc">客廳沙發牆立面示意：鐘面中心建議在離地 150 到 170 公分之間，掛在沙發側邊的牆面；沙發正上方標示為先排除的位置。</desc>
  <rect width="960" height="560" rx="24" fill="#f7f4eb"/>
  <rect x="60" y="58" width="840" height="442" fill="#fff" stroke="#33443b" stroke-width="6"/>
  <path d="M40 500H920" stroke="#33443b" stroke-width="8"/>
  <rect x="80" y="211" width="800" height="34" fill="#2f7d57" opacity=".12"/>
  <path d="M80 211H880M80 245H880" stroke="#2f7d57" stroke-width="3" stroke-dasharray="12 8"/>
  <g font-family="sans-serif" fill="#26352e">
    <rect x="300" y="355" width="360" height="70" rx="16" fill="#c9d5ce" stroke="#33443b" stroke-width="4"/>
    <rect x="290" y="415" width="380" height="85" rx="14" fill="#b9c8bf" stroke="#33443b" stroke-width="4"/>
    <text x="480" y="468" text-anchor="middle" font-size="26">沙發（椅背約 85 公分）</text>
    <circle cx="480" cy="270" r="40" fill="#fff" stroke="#b54a46" stroke-width="6"/>
    <path d="M455 245L505 295M505 245L455 295" stroke="#b54a46" stroke-width="6"/>
    <text x="480" y="335" text-anchor="middle" font-size="22" fill="#913835" font-weight="700">沙發正上方：先排除</text>
    <circle cx="790" cy="228" r="40" fill="#fff" stroke="#2f7d57" stroke-width="6"/>
    <path d="M790 228V200M790 228L810 238" stroke="#2f7d57" stroke-width="5" stroke-linecap="round"/>
    <text x="790" y="300" text-anchor="middle" font-size="22" fill="#245b42" font-weight="700">側牆：坐著轉頭可見</text>
    <text x="150" y="203" font-size="22" fill="#245b42" font-weight="700">鐘面中心 150–170 公分</text>
    <path d="M110 500V228" stroke="#4a5c52" stroke-width="3"/>
    <path d="M100 228H120M100 500H120" stroke="#4a5c52" stroke-width="3"/>
    <text x="128" y="380" font-size="20" fill="#4a5c52">約 160 公分</text>
    <text x="480" y="540" text-anchor="middle" font-size="21" fill="#4a5c52">站著平視、坐著略抬頭都看得到；掛太高要抬頭看，掛在座位上方有掉落風險。</text>
  </g>
</svg>
