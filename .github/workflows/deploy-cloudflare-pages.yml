name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_ADSENSE_CLIENT: ca-pub-7052036786750044

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name roomfeng-win --branch main

      # Waits for the fresh deploy to serve the updated sitemap, then submits
      # it to Google Search Console. Requires GSC_SERVICE_ACCOUNT_JSON repo
      # secret (same service account JSON used by funnytools). Deliberately
      # NOT gated behind an "if secret exists" check — CLAUDE.md 紅線第 6 條
      # requires a broken/missing pipeline to fail loudly, not skip silently
      # (that silent-skip pattern is exactly how funnytools' equivalent step
      # went unnoticed for months). scripts/gsc-submit-sitemap.mjs itself
      # exits 1 with a clear message when credentials are missing.
      - name: Submit sitemap to Google Search Console
        run: sleep 60 && npm run gsc:submit-sitemap
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
