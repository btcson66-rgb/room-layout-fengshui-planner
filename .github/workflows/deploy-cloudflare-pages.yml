name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          # 2026-08-24: migrated off the old AdSense account (btcson66).
          # That account's sign-in mailbox is no longer accessible, so the site
          # is being re-submitted for review under account zxc851558. Keep this
          # value in sync with public/ads.txt — AdSense matches the two.
          PUBLIC_ADSENSE_CLIENT: ca-pub-9117672212804270

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name roomfeng-win --branch main

      # Waits for the fresh deploy to serve the updated sitemap, then reads its
      # Google Search Console state and registers it only when it is absent.
      # Owner user OAuth is preferred; GSC_SERVICE_ACCOUNT_JSON is a legacy
      # fallback when user OAuth is absent. Deliberately
      # NOT gated behind an "if secret exists" check — CLAUDE.md 紅線第 6 條
      # requires a broken/missing pipeline to fail loudly, not skip silently
      # (that silent-skip pattern is exactly how funnytools' equivalent step
      # went unnoticed for months). scripts/gsc-submit-sitemap.mjs itself
      # exits 1 when credentials or the API fail, but not merely for pending.
      - name: Submit sitemap to Google Search Console
        run: sleep 60 && npm run gsc:submit-sitemap
        env:
          FABLE_OPS_OAUTH_CLIENT_JSON: ${{ secrets.FABLE_OPS_OAUTH_CLIENT_JSON }}
          FABLE_OPS_REFRESH_TOKEN: ${{ secrets.FABLE_OPS_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
