name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: npm ci

      - name: Install Chromium for post-deploy browser and Lighthouse gates
        run: npx playwright install --with-deps chromium

      - name: Build PRODUCT-002 package fixture for integrity tests
        run: python -m pip install --disable-pip-version-check reportlab pillow && python scripts/generate-product-002-package.py

      - run: npm run amazon:refresh
        env:
          AMAZON_AFFILIATE_BOOTSTRAP_MODE: auto
          AMAZON_CREATORS_API_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_API_CLIENT_ID }}
          AMAZON_CREATORS_API_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_API_CLIENT_SECRET }}
          AMAZON_CREATORS_API_VERSION: ${{ secrets.AMAZON_CREATORS_API_VERSION }}
          AMAZON_CREATORS_API_MARKETPLACE: www.amazon.com

      # 2026-09-02: 這個 job 過去只跑 `npm run build`，所以 astro check、
      # content-quality-audit.mjs 與 www-redirect 測試從來沒有在 CI 執行過。
      # 下面把 `npm run preflight` 的四個步驟攤開跑，順序與它一致
      # （check → build → audit:content → test:www-redirect），
      # 攤開是為了讓 build 帶著自己的 env，而 audit 讀的正是那次 build 的 dist。
      # 任何一步失敗就不會進到 deploy。
      - run: npm run check

      - run: npm run build
        env:
          AMAZON_AFFILIATE_BOOTSTRAP_MODE: auto
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_AFFILIATE_GA_ID: G-Q78WN8NZ0R
          PUBLIC_MOVING_OS_PAYHIP_CHECKOUT_URL: ${{ vars.PUBLIC_MOVING_OS_PAYHIP_CHECKOUT_URL }}
          PUBLIC_MOVING_OS_PAYHIP_PRODUCT_LINK: ${{ vars.PUBLIC_MOVING_OS_PAYHIP_PRODUCT_LINK }}
          PUBLIC_MOVING_OS_GUMROAD_CHECKOUT_URL: ${{ vars.PUBLIC_MOVING_OS_GUMROAD_CHECKOUT_URL }}
          PUBLIC_MOVING_OS_GUMROAD_PRODUCT_ID: ${{ vars.PUBLIC_MOVING_OS_GUMROAD_PRODUCT_ID }}
          PUBLIC_MOVING_OS_SUPPORT_EMAIL: ${{ vars.PUBLIC_MOVING_OS_SUPPORT_EMAIL }}
          PUBLIC_MOVING_OS_REFUND_POLICY_URL: ${{ vars.PUBLIC_MOVING_OS_REFUND_POLICY_URL }}
          PUBLIC_MOVING_OS_RELEASE_DATE: ${{ vars.PUBLIC_MOVING_OS_RELEASE_DATE }}
          PUBLIC_LAYOUT_VAULT_PAYHIP_CHECKOUT_URL: ${{ vars.PUBLIC_LAYOUT_VAULT_PAYHIP_CHECKOUT_URL }}
          PUBLIC_LAYOUT_VAULT_PAYHIP_PRODUCT_LINK: ${{ vars.PUBLIC_LAYOUT_VAULT_PAYHIP_PRODUCT_LINK }}
          PUBLIC_LAYOUT_VAULT_GUMROAD_CHECKOUT_URL: ${{ vars.PUBLIC_LAYOUT_VAULT_GUMROAD_CHECKOUT_URL }}
          PUBLIC_LAYOUT_VAULT_GUMROAD_PRODUCT_ID: ${{ vars.PUBLIC_LAYOUT_VAULT_GUMROAD_PRODUCT_ID }}
          PUBLIC_LAYOUT_VAULT_SUPPORT_EMAIL: ${{ vars.PUBLIC_LAYOUT_VAULT_SUPPORT_EMAIL }}
          PUBLIC_LAYOUT_VAULT_REFUND_POLICY_URL: ${{ vars.PUBLIC_LAYOUT_VAULT_REFUND_POLICY_URL }}
          # 2026-08-24: migrated off the old AdSense account (btcson66).
          # That account's sign-in mailbox is no longer accessible, so the site
          # is being re-submitted for review under account zxc851558. Keep this
          # value in sync with public/ads.txt — AdSense matches the two.
          PUBLIC_ADSENSE_CLIENT: ca-pub-9117672212804270

      - run: npm run audit:content

      - run: npm run audit:headings

      - run: npm run audit:bundle

      - run: npm run test:us-seo

      - run: npm run audit:us-seo

      - name: Verify current production SEO parity before deploy
        run: npm run test:seo-production-parity

      - run: npm run test:www-redirect

      - name: Verify PRODUCT-002 analytics routing
        run: node --test tests/affiliate-ga4-routing.test.mjs tests/affiliate-ga4.test.mjs

      - name: Verify PRODUCT-002 Phase 3 gates
        run: npm run test:product-002:phase3

      - name: Verify PRODUCT-002 geometry and matching
        run: npm run test:product-002

      - name: Verify PRODUCT-002 entitlement isolation
        run: npm run test:product-002:entitlement

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name roomfeng-win --branch main

      - name: Set Chromium path for post-deploy Lighthouse
        shell: bash
        run: echo "CHROME_PATH=$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Wait for and read back production content
        run: node scripts/production-release-readback.mjs
        env:
          ROOMFENG_RELEASE_READBACK_DIR: release-evidence/production-readback
          ROOMFENG_RELEASE_READBACK_WAIT_MS: 10000
          ROOMFENG_RELEASE_READBACK_ATTEMPTS: 18

      - name: Read back merged commit and deployment workflow SHA
        run: node scripts/production-commit-readback.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ROOMFENG_COMMIT_READBACK_PATH: release-evidence/commit-readback.json

      - name: Run production browser gate
        run: npm run test:production-hardening-browser
        env:
          ROOMFENG_PRODUCTION_EVIDENCE_DIR: release-evidence/production-browser

      - name: Run production Lighthouse gate (desktop and mobile)
        run: npm run test:lighthouse:production
        env:
          ROOMFENG_LIGHTHOUSE_DIR: release-evidence/production-lighthouse

      - name: Run post-deploy production SEO parity gate
        run: npm run test:seo-production-parity
        env:
          ROOMFENG_SEO_EVIDENCE_DIR: release-evidence/production-seo

      - name: Run post-deploy sitemap readback gate
        run: node scripts/production-sitemap-readback.mjs
        env:
          ROOMFENG_SITEMAP_READBACK_PATH: release-evidence/production-sitemap-readback.json

      # Waits for the fresh deploy to serve the updated sitemap, then reads its
      # Google Search Console state and registers it only when it is absent.
      # Owner user OAuth is preferred; GSC_SERVICE_ACCOUNT_JSON is a legacy
      # fallback when user OAuth is absent. Deliberately
      # NOT gated behind an "if secret exists" check — CLAUDE.md 紅線第 6 條
      # requires a broken/missing pipeline to fail loudly, not skip silently
      # (that silent-skip pattern is exactly how funnytools' equivalent step
      # went unnoticed for months). scripts/gsc-submit-sitemap.mjs itself
      # exits 1 when credentials or the API fail, but not merely for pending.
      #
      # 2026-09-06: PR #76 曾讓「Google 遲遲沒下載 sitemap」也 exit 1，違反上面這句
      # 自己寫的契約，結果每一次部署都紅同一件事、連續兩週，紅燈失去意義。
      # 現已改回：這一步只管提交有沒有成功；「Google 到底有沒有來抓」由
      # fable-company 的每日健檢負責（scripts/lib/gsc-sitemap-discovery.mjs，
      # issue code sitemap-never-downloaded，單站 warning／三站全中 critical，
      # 並附 URL Inspection 的 Googlebot 爬取狀態）。STUCK 警告仍會印在本步驟的 log。
      - name: Submit sitemap to Google Search Console
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release-evidence
          sleep 60
          npm run gsc:submit-sitemap 2>&1 | tee release-evidence/gsc-submission.log
        env:
          FABLE_OPS_OAUTH_CLIENT_JSON: ${{ secrets.FABLE_OPS_OAUTH_CLIENT_JSON }}
          FABLE_OPS_REFRESH_TOKEN: ${{ secrets.FABLE_OPS_REFRESH_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}

      - name: Write final release verdict
        run: node scripts/final-release-verdict.mjs
        env:
          ROOMFENG_RELEASE_EVIDENCE_DIR: release-evidence

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roomfeng-production-release-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
